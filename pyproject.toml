[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "wearwise-ai"
version = "0.1.0"
description = "Python AI inference services and model pipelines for WearWise."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1.0",
    "openai>=1.99,<3.0",
    "python-dotenv>=1.0,<2.0",
    "pydantic>=2.11,<3.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.4,<9.0",
    "ruff>=0.12,<1.0",
]
ml = [
    "einops>=0.8,<1.0",
    "kornia>=0.8,<1.0",
    "numpy>=2.0,<3.0",
    "pillow>=10.0,<12.0",
    "protobuf>=5.0,<7.0",
    "sentencepiece>=0.2,<1.0",
    "timm>=1.0,<2.0",
    "torch>=2.4,<3.0",
    "torchvision>=0.19,<1.0",
    "transformers>=4.48,<5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wearwise_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
